<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucid</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234b45d6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">

    try { const t = localStorage.getItem("lucid.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark"></span>Lucid</a>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="spacer"></div>
    <button class="chip-engine" id="engine-chip" title="Moteur Path of Building"><span class="dot busy"></span><span>Démarrage du moteur…</span></button>
    <button class="btn sm" id="sync-btn" title="Importer un guide ou mettre à jour ton perso depuis ton compte PoE">Importer / Synchroniser</button>
    <button class="icon-btn gear" id="settings-btn" title="Réglages" aria-label="Réglages">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="icon-btn" id="theme-btn" title="Thème clair / sombre" aria-label="Changer de thème">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main id="app"></main>
  <script src="core.js"></script>
  <script src="components.js"></script>
  <script src="tree.js"></script>
  <script src="ui_health.js"></script>
  <script src="ui_guide.js"></script>
  <script src="ui_sandbox.js"></script>
  <script src="ui_expert.js"></script>
  <script src="ui_creator.js"></script>
  <script src="ui_settings.js"></script>
  <script src="ui_home.js"></script>
  <script src="main.js"></script>
</body>
</html>
